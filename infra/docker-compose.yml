version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hospital-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hospital_voice_db
      POSTGRES_USER: hospital_user
      POSTGRES_PASSWORD: hospital_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospital_user -d hospital_voice_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hospital-net

  redis:
    image: redis:7-alpine
    container_name: hospital-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hospital-net

  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    container_name: hospital-voice-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://hospital_user:hospital_password@postgres:5432/hospital_voice_db
      - REDIS_URL=redis://redis:6379/0
      - REDIS_ENABLED=true
      - PORT=8000
      - HOST=0.0.0.0
    ports:
      - "8000:8000"
    networks:
      - hospital-net

  frontend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.frontend
    container_name: hospital-voice-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - hospital-net

volumes:
  postgres_data:
  redis_data:

networks:
  hospital-net:
    driver: bridge
